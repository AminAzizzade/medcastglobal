<!doctype html>
<html lang="tr" data-theme="v3">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hakkımızda | Medcast Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="alternative.css">
  <link rel="stylesheet" href="about.css">
</head>
<body data-page="about">
  <div class="alternative-site">
    <div data-shared-header></div>
    <main id="about-top">
      <section class="about-intro" aria-labelledby="about-title">
        <div class="alt-container about-intro-inner"><div class="about-intro-copy"><h1 id="about-title" data-about-text="pageTitle"></h1><p data-about-text="intro"></p></div></div>
        <div class="about-image about-cover" data-about-image="cover"></div>
      </section>
      <section class="about-story" aria-labelledby="story-title"><div class="alt-container about-split"><div class="about-founder-identity"><div class="about-image about-founder-photo" data-about-image="founder.photo"></div><small class="about-founder-photo-caption" data-about-text="founder.photo.caption"></small><div class="about-founder-details"><span class="about-founder-name" data-about-text="founder.name"></span><span class="about-founder-role" data-about-text="founder.role"></span></div></div><div class="about-prose"><h2 id="story-title" data-about-text="storyTitle"></h2><p data-about-text="story"></p></div></div></section>
      <section class="about-principles" aria-labelledby="principles-title"><div class="alt-container"><div class="about-principles-heading"><h2 id="principles-title" class="about-section-title" data-about-text="principles.heading"></h2></div><ol class="about-principles-list" id="principles-list"></ol></div></section>
      <section class="about-corporate about-reveal" aria-labelledby="corporate-title"><div class="alt-container"><div class="about-corporate-heading"><h2 id="corporate-title" class="about-section-title" data-about-text="corporate.label"></h2></div><div class="about-corporate-columns"><article><span class="about-section-label" data-about-text="corporate.mission.label"></span><h3 data-about-text="corporate.mission.title"></h3><p data-about-text="corporate.mission.description"></p></article><article><span class="about-section-label" data-about-text="corporate.vision.label"></span><h3 data-about-text="corporate.vision.title"></h3><p data-about-text="corporate.vision.description"></p></article></div><div class="about-positioning"><div class="about-positioning-copy"><h3><span data-about-text="corporate.positioning.titleFirst"></span><span data-about-text="corporate.positioning.titleSecond"></span></h3><p data-about-text="corporate.positioning.description"></p></div><div class="about-positioning-map"><div class="about-map-image" data-about-image="corporate.positioning.map"></div></div></div></div></section>
    </main>
    <div data-shared-footer></div>
  </div>
  <script src="shared-shell.js"></script>
  <script src="about-content.js"></script>
  <script src="about-page.js"></script>

</html>
